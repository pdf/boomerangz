syntax = "proto3";

package boomerangz.control.v1;

option go_package = "github.com/pdf/boomerangz/internal/control/rpc;rpc";

service StatusService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);
}

service ControlService {
  rpc Trigger(TriggerRequest) returns (TriggerResponse);
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc Clean(CleanRequest) returns (CleanResponse);
  // ReportReceive lets a receive served outside the daemon, by an ssh-shell
  // process, show in the daemon's status. Its first message starts the
  // receive; each later one reports progress. The receive stays listed until
  // the stream ends, however it ends. It is accepted only on a Unix socket.
  rpc ReportReceive(stream ReportReceiveRequest) returns (ReportReceiveResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  StatusSnapshot status = 1;
}

// A watch sends a message whenever the daemon's status changes, and at no other
// time. Its first message is the status at registration.
message WatchStatusRequest {
  // The watch interval was retired: every change is delivered as it happens.
  reserved 1;
  reserved "interval_milliseconds";
}

message WatchStatusResponse {
  StatusSnapshot status = 1;
  // Every job-state transition since the previous message, in the order the
  // daemon recorded them. The first message carries none. Progress fields are
  // unset: a transition is a change of state, not a sample.
  repeated JobStatus transitions = 2;
}

message QueueStatus {
  string name = 1;
  uint32 capacity = 2;
  uint32 pending = 3;
  repeated string job_ids = 4;
}

message JobStatus {
  string pool = 1;
  string job = 2;
  string dataset = 3;
  string target = 4;
  string state = 5;
  string reason = 6;
  int64 changed_unix_nano = 7;
  uint32 pending = 8;
  uint32 queue_position = 9;
  uint64 bytes = 10;
  uint64 total_bytes = 11;
  double bytes_per_second = 12;
  int64 eta_nanoseconds = 13;
  bool total_known = 14;
  // run_id is shared by every transition of one run of a job, and is unique
  // within one daemon process.
  uint64 run_id = 15;
  // The identity fields are each set only on the transitions they describe.
  // snapshot: a snapshot job's created snapshot (succeeded) or the owned
  // snapshot that set its deadline (scheduled); a transfer's source snapshot
  // (sending), the snapshot now on the destination (succeeded), or the
  // pending snapshot a run carried (waiting-retry, blocked, cancelled; not
  // cancelled while still queued).
  string snapshot = 16;
  // base: the snapshot or bookmark an incremental transfer is based on
  // (sending).
  string base = 17;
  // mode: full, incremental-latest, incremental-all, or resume (sending).
  string mode = 18;
  // destination: the destination dataset of a transfer (succeeded).
  string destination = 19;
  // marker: set, cleared, or none, for an inactive reconciliation
  // (succeeded).
  string marker = 20;
  // destroyed: at most 64 snapshots a prune or retirement destroyed
  // (succeeded); destroyed_count is the total.
  repeated string destroyed = 21;
  uint32 destroyed_count = 22;
  // config_generation: the generation a configuration reload published
  // (succeeded).
  uint64 config_generation = 23;
  // retry_unix_nano: when the daemon next tries a transfer again
  // (waiting-retry).
  int64 retry_unix_nano = 24;
  // attempts: how many attempts in a row have failed (waiting-retry), where
  // the transfer counts them; zero where it does not.
  uint32 attempts = 25;
}

message DatasetStatus {
  string name = 1;
  // active is set on a root the daemon schedules.
  bool active = 2;
  bool recursive = 3;
  int64 next_snapshot_unix_nano = 4;
  // status is the dataset's management status, as `dataset list` reports
  // it: active, member, excluded, target, inactive, or invalid.
  string status = 5;
  // covered_by is the actor root a member or excluded dataset lies under.
  string covered_by = 6;
  // blocked lists the targets an actor root may not send to.
  repeated BlockedTarget blocked = 7;
}

message BlockedTarget {
  // target is a local destination root or, with remote, a remote's name.
  string target = 1;
  bool remote = 2;
  string reason = 3;
}

message StatusSnapshot {
  uint64 revision = 1;
  int64 observed_unix_nano = 2;
  uint64 generation = 3;
  repeated DatasetStatus datasets = 4;
  repeated QueueStatus queues = 5;
  repeated JobStatus jobs = 6;
  uint64 config_generation = 7;
  // destinations holds the latest delegated-permission check of each
  // destination checked so far, local destinations first and each kind by
  // name.
  repeated DestinationPermissions destinations = 8;
  // receives lists the receives into this host in progress, and the
  // interrupted ones a sender may resume, by dataset.
  repeated ReceiveStatus receives = 9;
}

// ReceiveStatus is one receive into this host. Progress is known only for a
// receive the daemon serves itself (the native transport) or one an ssh-shell
// process reports; a receive found only by its traces in ZFS has none.
message ReceiveStatus {
  // dataset is the receive's destination dataset: the root of a recursive
  // receive.
  string dataset = 1;
  // state is receiving, or interrupted for a receive that stopped and left
  // a resume token behind.
  string state = 2;
  // sender_host is the sending host as it names itself: display text only.
  string sender_host = 3;
  // transport is native, ssh-shell, or empty when the receive was found only
  // by its traces in ZFS.
  string transport = 4;
  int64 started_unix_nano = 5;
  uint64 bytes = 6;
  // total_bytes is the sender's estimate, when total_known is set.
  uint64 total_bytes = 7;
  bool total_known = 8;
  double bytes_per_second = 9;
  int64 eta_nanoseconds = 10;
}

// DestinationPermissions is the latest check of one destination's delegated
// ZFS permissions against everything boomerangz may need there. A non-empty
// missing or error is a warning: transfers go on, and an operation that needs a
// missing permission still fails its own preflight.
message DestinationPermissions {
  // destination is a local destination root or, with remote, a remote's name.
  string destination = 1;
  bool remote = 2;
  // dataset is where the check ran: the destination root, or its nearest
  // existing ancestor while the root is absent.
  string dataset = 3;
  // account is the account that lacks the missing permissions.
  string account = 4;
  repeated string missing = 5;
  // error says why the check itself could not run.
  string error = 6;
  int64 checked_unix_nano = 7;
}

message ListDatasetsRequest {}

message ListDatasetsResponse {
  uint64 generation = 1;
  repeated DatasetStatus datasets = 2;
}

message TriggerRequest {
  repeated string datasets = 1;
}

message ReconcileRequest {}

message TriggerResponse {
  repeated string accepted = 1;
}

message ReconcileResponse {
  bool accepted = 1;
}

message ReloadRequest {}

message ReloadResponse {
  uint64 generation = 1;
  repeated string applied = 2;
  repeated string restart_required = 3;
}

message ReportReceiveRequest {
  // start is set on the first message only.
  ReceiveStart start = 1;
  // bytes is how many bytes of the stream zfs receive has accepted so far.
  uint64 bytes = 2;
  double bytes_per_second = 3;
}

message ReceiveStart {
  string dataset = 1;
  string sender_host = 2;
  optional uint64 estimated_bytes = 3;
}

message ReportReceiveResponse {}

message CleanRequest {
  repeated string datasets = 1;
  bool recursive = 2;
  bool all = 3;
  bool destroy_owned_snapshots = 4;
  bool apply = 5;
  // Targets whose state alone is cleaned, unchecked: target IDs, configured
  // remote names or local destination roots.
  repeated string forget_targets = 6;
}

message CleanAction {
  string operation = 1;
  string object = 2;
  string property = 3;
  uint64 guid = 4;
}

message CleanPlan {
  string dataset = 1;
  bool recursive = 2;
  bool destroy_owned_snapshots = 3;
  repeated CleanAction actions = 4;
  repeated string blockers = 5;
  repeated string warnings = 6;
  uint32 applied = 7;
  repeated string forget_targets = 8;
}

message CleanResponse {
  repeated CleanPlan plans = 1;
  string error = 2;
}
