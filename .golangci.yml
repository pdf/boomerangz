version: "2"

run:
  # Integration tests are gated by this tag; linting without it would skip
  # them. No file is excluded by the tag, so this lints a superset.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - govet
    - nilerr
    - noctx
    - revive
    - staticcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
