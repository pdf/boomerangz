name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.8
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go tool buf format --diff --exit-code
      - run: go tool buf lint
      - run: go tool buf generate
      - run: git diff --exit-code
