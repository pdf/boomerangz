name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install shell workflow linter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go tool buf format --diff --exit-code
      - run: go tool buf lint
      - run: go tool buf generate
      - run: go tool actionlint
      - run: shellcheck test/integration/host/*.sh test/integration/guest/*.sh test/integration/targets/*/*.sh
      - run: git diff --exit-code
