name: Documentation publication

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # GitHub does not evaluate path filters for tag pushes, so every matching
    # release tag is published even when its commit contains no docs changes.
    paths:
      - 'docs/**'
      - '.github/scripts/publish-docs.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: documentation-publication
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/require-quality.yml
    with:
      sha: ${{ github.sha }}

  publish:
    name: Publish documentation tree
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Prepare durable documentation branch
        shell: bash
        run: |
          published_dir="${RUNNER_TEMP}/boomerangz-docs-published"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages "$published_dir" origin/gh-pages
          echo "PUBLISHED_DIR=$published_dir" >> "$GITHUB_ENV"
      - name: Build changed and missing documentation
        env:
          DOCS_EVENT: ${{ github.ref_type }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/publish-docs.sh "$PWD" "$PUBLISHED_DIR"
      - name: Commit durable documentation
        shell: bash
        run: |
          touch "$PUBLISHED_DIR/.nojekyll"
          git -C "$PUBLISHED_DIR" config user.name github-actions
          git -C "$PUBLISHED_DIR" config user.email github-actions@github.com
          git -C "$PUBLISHED_DIR" add --all
          if git -C "$PUBLISHED_DIR" diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$PUBLISHED_DIR" commit -m "docs: publish $GITHUB_REF_NAME"
          git -C "$PUBLISHED_DIR" push origin HEAD:gh-pages
