name: Documentation publication

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # GitHub does not evaluate path filters for tag pushes, so every matching
    # release tag is published even when its commit contains no docs changes.
    paths:
      - 'docs/**'
      - '.github/scripts/publish-docs.sh'
      - '.github/scripts/publish-gh-pages.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# A concurrency group keeps one run waiting and cancels any older waiting run,
# even with cancel-in-progress off, so the group is per ref: a newer push to
# main replaces a main run still waiting, which would only have published
# older development docs, and nothing else can displace a release tag's run.
# Runs for different refs, and the release workflow's apt publication, still
# share gh-pages; publish-gh-pages.sh rebuilds and retries a push that loses
# that race instead of serialising them.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/require-quality.yml
    with:
      sha: ${{ github.sha }}

  publish:
    name: Publish documentation tree
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Publish documentation to gh-pages
        env:
          DOCS_EVENT: ${{ github.ref_type }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: |
          published_dir="${RUNNER_TEMP}/boomerangz-docs-published"
          bash .github/scripts/publish-gh-pages.sh "$published_dir" \
            "docs: publish $GITHUB_REF_NAME" . \
            bash .github/scripts/publish-docs.sh "$PWD" "$published_dir"
