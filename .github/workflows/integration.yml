name: OpenZFS integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.target }} / OpenZFS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - cachyos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install host virtualization tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cloud-image-utils \
            openssh-client \
            qemu-system-x86 \
            qemu-utils
          sudo chmod 0666 /dev/kvm
      - name: Run guarded integration suite
        run: make integration-test INTEGRATION_TARGET=${{ matrix.target }}
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boomerangz-integration/*/diagnostics
          if-no-files-found: warn
          retention-days: 7
