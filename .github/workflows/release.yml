name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/require-quality.yml
    with:
      sha: ${{ github.sha }}

  draft:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      # A release that needs operators to act leads with its upgrade notes;
      # one that needs nothing gets no header.
      - name: Extract upgrade notes for this release
        id: upgrade-notes
        run: |
          set -euo pipefail
          header=$RUNNER_TEMP/upgrade-notes.md
          bash .github/scripts/upgrade-notes.sh "$GITHUB_REF_NAME" >"$header"
          if [[ -s $header ]]; then
            echo "args=--release-header=$header" >>"$GITHUB_OUTPUT"
          fi
      - name: Build draft release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean ${{ steps.upgrade-notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stage AUR install script
        run: cp contrib/arch/boomerangz.install dist/aur/boomerangz.install
      - name: Verify portable release binaries
        run: |
          set -euo pipefail
          for binary in dist/boomerangz_linux_*/boomerangz; do
            file "$binary" | grep -F 'statically linked'
            if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
              echo "release binary has a program interpreter: $binary" >&2
              exit 1
            fi
            if readelf -d "$binary" | grep -q '(NEEDED)'; then
              echo "release binary has a dynamic dependency: $binary" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate packages (${{ matrix.target }})
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Arch packages are validated on CachyOS; the .deb, installed from an
        # apt repository built as publish-apt builds it, on each Ubuntu.
        target:
          - cachyos
          - ubuntu-lts
          - ubuntu-current
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Install host virtualization tools
        # An install takes a minute or two; one that hangs on a stalled mirror
        # or a held dpkg lock would otherwise use the whole job timeout.
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cloud-image-utils \
            openssh-client \
            qemu-system-x86 \
            qemu-utils
          sudo chmod 0666 /dev/kvm
      - name: Validate release packages in the supported guest
        env:
          BOOMERANGZ_RELEASE_DIR: ${{ github.workspace }}/dist
        run: make integration-package-test INTEGRATION_TARGET=${{ matrix.target }}
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boomerangz-integration/*/diagnostics
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the validated draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag --repo "$GITHUB_REPOSITORY"

  publish-aur:
    if: ${{ vars.PUBLISH_AUR == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Publish boomerangz to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: boomerangz
          pkgbuild: dist/aur/boomerangz.pkgbuild
          assets: dist/aur/boomerangz.install
          commit_username: ${{ vars.AUR_COMMIT_USERNAME }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Release ${{ github.ref_name }}
      - name: Publish boomerangz-bin to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: boomerangz-bin
          pkgbuild: dist/aur/boomerangz-bin.pkgbuild
          assets: dist/aur/boomerangz.install
          commit_username: ${{ vars.AUR_COMMIT_USERNAME }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Release ${{ github.ref_name }}

  # The apt repository lives beside the documentation on the gh-pages branch,
  # served at https://boomerangz.org/apt, so it shares the documentation
  # workflow's concurrency group: both push to that branch.
  publish-apt:
    if: ${{ vars.PUBLISH_APT == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repository carries one release, so only the newest final release
      # replaces it: a prerelease, or a patch to an older line, would roll
      # every user back.
      - name: Decide whether this release is the newest
        id: newest
        run: |
          set -euo pipefail
          newest=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [[ $GITHUB_REF_NAME == "$newest" ]]; then
            echo 'publish=true' >>"$GITHUB_OUTPUT"
          else
            printf 'Not publishing %s to apt: the newest release is %s.\n' "$GITHUB_REF_NAME" "$newest"
          fi
      - uses: actions/download-artifact@v8
        if: steps.newest.outputs.publish == 'true'
        with:
          name: release-dist
          path: dist
      - name: Install repository tools
        if: steps.newest.outputs.publish == 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils
      - name: Import the repository signing key
        id: key
        if: steps.newest.outputs.publish == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ -n $fingerprint ]]
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "fingerprint=$fingerprint" >>"$GITHUB_OUTPUT"
      - name: Build the apt repository on gh-pages
        if: steps.newest.outputs.publish == 'true'
        env:
          KEY: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          site=$RUNNER_TEMP/boomerangz-site
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages "$site" origin/gh-pages
          bash .github/scripts/apt-repository.sh "$site/apt" "$KEY" dist/*.deb
          git -C "$site" config user.name github-actions
          git -C "$site" config user.email github-actions@github.com
          git -C "$site" add --all apt
          if git -C "$site" diff --cached --quiet; then
            exit 0
          fi
          git -C "$site" commit -m "apt: publish $GITHUB_REF_NAME"
          git -C "$site" push origin HEAD:gh-pages
