name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change made only of documentation skips the guest suite; see
  # guest-suite-needed.sh for what counts. Anything this job cannot list, a
  # manual run or a push with no previous commit, runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      guests: ${{ steps.classify.outputs.guests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the guest suite must run
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request is checked out as its merge with the base, so its
          # first parent is the base it merges into.
          case $EVENT in
          pull_request) range=HEAD^1..HEAD ;;
          push) range=$PUSH_BEFORE..HEAD ;;
          *) range= ;;
          esac
          if [[ -n $range ]] && paths=$(git diff --name-only "$range"); then
            printf '%s\n' "$paths"
            printf '%s\n' "$paths" | bash .github/scripts/guest-suite-needed.sh | tee -a "$GITHUB_OUTPUT"
          else
            echo 'guests=true' | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    name: Host validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install shell workflow linter
        # An install takes a minute or two; one that hangs on a stalled mirror
        # or a held dpkg lock would otherwise use the whole job timeout.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - run: make test
      - run: git diff --exit-code

  integration:
    name: ${{ matrix.target }} / OpenZFS (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.guests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - cachyos
          # The current Ubuntu LTS and interim releases; each config.sh pins
          # its image.
          - ubuntu-lts
          - ubuntu-current
        # Each shard runs whole stages, unfiltered, in a guest of its own, so
        # the suite takes as long as its longest shard. Together the shards
        # are every stage; TestCIShardsCoverEveryStage checks that.
        shard:
          - transfer
          - daemon
          - lifecycle,control
    env:
      # The runner is dedicated to this job, so the guest gets all of it.
      BOOMERANGZ_GUEST_VCPUS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      # The harness reuses a provisioned guest image for up to a week; the
      # cache carries it between runs, and the week in the key retires it.
      # The image only boots on hosts of the CPU class it was provisioned on,
      # and runners vary, so the key is the harness's own image key.
      - name: Name the guest image cache
        id: image
        run: |
          set -euo pipefail
          echo "key=integration-image-${{ matrix.target }}-$(test/integration/host/image-key.sh ${{ matrix.target }})-$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/boomerangz-integration
          key: ${{ steps.image.outputs.key }}
      - name: Install host virtualization tools
        # An install takes a minute or two; one that hangs on a stalled mirror
        # or a held dpkg lock would otherwise use the whole job timeout.
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cloud-image-utils \
            openssh-client \
            qemu-system-x86 \
            qemu-utils
          sudo chmod 0666 /dev/kvm
      - name: Run guarded integration suite
        env:
          BOOMERANGZ_INTEGRATION_SHARD: ${{ matrix.shard }}
        run: make integration-test INTEGRATION_TARGET=${{ matrix.target }}
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.target }}-shard${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boomerangz-integration/*/diagnostics
          if-no-files-found: warn
          retention-days: 7

  documentation:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

  gate:
    name: Quality gate
    if: always()
    needs:
      - changes
      - test
      - integration
      - documentation
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GUESTS: ${{ needs.changes.outputs.guests }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          failures=0
          for result in "$CHANGES_RESULT" "$TEST_RESULT" "$DOCUMENTATION_RESULT"; do
            if [[ $result != success ]]; then
              failures=1
            fi
          done
          # The guest suite may be skipped only for a change the changes job
          # classified as documentation alone. Any other skip, such as a
          # condition that no longer reads its output, fails the gate.
          if [[ $INTEGRATION_RESULT != success ]] &&
            ! [[ $INTEGRATION_RESULT == skipped && $GUESTS == false ]]; then
            failures=1
          fi
          exit "$failures"
